<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Institute of Catering Brand Mark">
  <!--
    Source brand mark. Replace this file with your own square SVG, then run
    `pnpm assets` to regenerate every favicon, app icon and Open Graph image.
    Keep the 512x512 viewBox and leave ~10% breathing room around the artwork.
  -->
  <rect width="512" height="512" rx="112" fill="#0d1b2a" />

  <!-- A stylized fork and knife to represent catering, built with simple geometric paths -->
  <g fill="none" stroke="#e0e1dd" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork -->
    <path d="M192 128 v100 a48 48 0 0 0 48 48 v112" />
    <path d="M152 128 v100 a88 88 0 0 0 40 48" />
    <path d="M232 128 v100 a88 88 0 0 1 -40 48" />

    <!-- Knife -->
    <path d="M320 388 V128 a48 48 0 0 1 48 48 v80 c-48 0 -48 48 -48 48" />
  </g>
</svg>
